[project]
name = "xxxflash"
version = "0.1.0"
description = "Sanic rewrite of the legacy xxxflash / flashsex Flash-games sites"
requires-python = ">=3.12"
dependencies = [
    "sanic>=25.3",
    "tortoise-orm[asyncpg]>=1.1",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "pillow>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "sanic-testing>=24.6",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.tortoise]
tortoise_orm = "app.config.TORTOISE_ORM"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive", "app/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.setuptools.package-data]
app = ["locales/*.json"]
