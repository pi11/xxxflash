<div class="paging">
Страница {{ flashes.number }} из {{ flashes.num_pages }}.
  <ul>
    {% if flashes.has_previous %}
    <li><a href="?p={{ flashes.previous_page_number }}">&larr;</a></li>
    {% endif %}
    {% for page in pages %}
      {% if page != page_id %}
      <li><a class="pages_links" href="?p={{ page }}">{{ page }}</a></li>
      {% else %}
      <li><span class="c_page">{{ page }}</span></li>
      {% endif %}
    {% endfor %}
    {% if flashes.has_next %}
    <li><a href="?p={{ flashes.next_page_number }}">&rarr;</a></li>
    {% endif %}
  </ul>
</div>
