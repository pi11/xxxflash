  <div class="comment" align="left">
    <div class="comment_header">
      <a id="c{{ comment.id }}" href="/game/{{ comment.game_id }}/">#{{ comment.id }}</a>
      {% if user.is_staff %}
      {% include "staff_comment_actions.html" %}
      {% endif %}
      {{ comment.created_at|date }}
      <a href="#" title="Рейтинг пользователя: {{ comment.user.score }}">{{ comment.user.username }} ({{ comment.user.score }}) </a> написал:
    </div>
    <div class="comment_text">
      {% if comment.user.avatar %}<div class="avatar"><img width="40" src="{{ media(comment.user.avatar) }}" alt="" /></div>{% endif %}
      {{ comment.text }}
    </div>
  </div>
