{% if random %}
<section id="flashes_random" class="shelf" aria-labelledby="random-title">
  <h2 id="random-title">{{ _("Случайные игры") }}</h2>
  <div class="shelf-row">
    {% for g in random %}
    <a href="/game/{{ g.id }}/" title="{{ g.title }}"><img src="{{ thumb(g) }}" alt="{{ g.title }}" loading="lazy" /></a>
    {% endfor %}
  </div>
</section>
{% endif %}
