{% if user.is_authenticated and user.username != 'Anonymous' %}
<span>{{ user.username }} <span class="score" title="Рейтинг">★ {{ user.score }}</span></span>
{% if user.is_staff %}<a href="/{{ settings.admin_prefix }}/">Админка</a>{% endif %}
<a href="/logout/">Выйти</a>
{% else %}
<a href="/login/">Войти</a>
{% endif %}
