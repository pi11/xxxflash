{% if user.is_authenticated and user.username != 'Anonymous' %}
<span>{{ user.username }} <span class="score" title="{{ _("Рейтинг") }}">★ {{ user.score }}</span></span>
{% if user.is_staff %}<a href="/{{ settings.admin_prefix }}/">{{ _("Админка") }}</a>{% endif %}
<a href="/logout/">{{ _("Выйти") }}</a>
{% else %}
<a href="/login/">{{ _("Войти") }}</a>
{% endif %}
