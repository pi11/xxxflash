<h2>{{ _("Жанры") }}</h2>
<ul>
  {% for t in themes|by_label %}
  <li>
    <a href="/theme/{{ t.slug }}/"{% if theme is defined and theme and theme.id == t.id %} aria-current="page"{% endif %}>
      <span>{{ t.title }}</span><span class="count">{{ num(t.game_count) }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
