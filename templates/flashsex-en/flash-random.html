{% if random %}
<section id="flashes_random" class="shelf" aria-labelledby="random-title">
  <h2 id="random-title">Something random</h2>
  <div class="shelf-row">
    {% for g in random %}
    <a href="/game/{{ g.id }}/"><img src="{{ thumb(g) }}" alt="" loading="lazy" /><span>{{ g.title }}</span></a>
    {% endfor %}
  </div>
</section>
{% endif %}
