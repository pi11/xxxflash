{# Ruffle player for game `g`. Replaces the legacy <object type="application/x-shockwave-flash">. #}
<div class="game-player" data-swf="{{ media(g.swf_path) }}"
     data-width="{{ g.width or 0 }}" data-height="{{ g.height or 0 }}" data-max-width="{{ max_width|default(700) }}">
  <div class="player-fallback" hidden>
    This game couldn't start in your browser.
    <a href="{{ media(g.swf_path) }}" download>Download the SWF</a>
  </div>
  <noscript>Turn on JavaScript to play.</noscript>
</div>
{% if g.compat == "as3" %}
<div class="player-note">This game may not work correctly.</div>
{% endif %}
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    publicPath: "/vendor/ruffle/",
    autoplay: "on",
    unmuteOverlay: "visible",
    splashScreen: false,
    letterbox: "on",
    warnOnUnsupportedContent: true,
    contextMenu: "rightClickOnly",
    allowScriptAccess: false,
    base: "{{ settings.media_url }}",
    openUrlMode: "confirm",
    allowNetworking: "internal"
  };
</script>
<script src="{{ vendor('ruffle/ruffle.js') }}"></script>
<script src="{{ vendor('player.js') }}"></script>
