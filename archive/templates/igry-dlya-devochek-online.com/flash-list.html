
<script type="text/javascript" charset="UTF8">
function vote(kind, id) {
  $.getJSON("/mark/", { pk:id, vote: kind }, function(json){
     $("#mark-"+id).text(json['success']);
  });
}
</script>
<div id="flashes">
{% for g in flashes.object_list %}
  <div class="game_list">
    <div class="thumb">
	<a title="{{ g.name }}" href="{% url 'view_game' game_id=g.id %}" target="_blank"><img alt="{{ g.name }}" src="{{ MEDIA_URL }}{{ g.thumbfile }}" style="width: 350px;" border="0" width="350" /></a>
    </div>

    <div class="description">
      <a href="{% url 'view_game' game_id=g.id %}" class="title title-1">{{ g.name }}</a>
      <div class="">
	{{ g.description|truncatewords:20 }}
      </div>
      <div style="padding-top:20px;">
	Рейтинг флэш игры:&nbsp;<span id="mark-{{ g.id }}">{{ g.rate }}</span>
	<a class="mark" onclick="vote('up', {{ g.id }});"><img src="{{ STATIC_URL }}images/up.gif" /></a> <a class="mark" onclick="vote('down', {{ g.id }});"><img src="{{ STATIC_URL }}images/down.gif" /></a>
	<div>
	  Просмотров:&nbsp;<span style="font-weight: 700;">{{ g.views }}</span>
	</div>
	{{ g.comments }}
      </div>

    </div>

  </div>
{% endfor %}
</div>
