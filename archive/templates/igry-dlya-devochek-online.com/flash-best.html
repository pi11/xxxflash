<div id="flashes_best" style="border:1px dashed gray; padding:5px; float:left; margin-bottom:20px;">
  <div style="float:left; width:100%; padding:5px; color:red;"><strong>Лучшие флэш игры для девочек:</strong></div>
  {% for g in best %}
  <div style="width:146px; float:left; ">
    <div style="float:left;">
      <a title="{{ g.name }}" href="{% url 'view_game' game_id=g.id %}" target="_blank"><img alt="{{ g.name }}" src="{{ MEDIA_URL }}{{ g.thumbfile }}" style="width: 145px;" border="0" height="120px" /></a>
    </div>
    <div style="float:left;">
      <a href="{% url 'view_game' game_id=g.id %}" class="title">{{ g.name }}</a>
      <!--     <div style="float:left; padding:6px;">
	       {{ g.description|truncatewords:20 }}
	       </div>-->
    </div>
  </div>
  {% endfor %}
  <div style="float:left; width:100%; padding:5px; color:red;"><strong>Случайные флэш игры девочкам:</strong></div>
  {% for g in random2 %}
  <div style="width:146px; float:left; ">
    <div style="float:left;">
      <a title="{{ g.name }}" href="{% url 'view_game' game_id=g.id %}" target="_blank"><img alt="{{ g.name }}" src="{{ MEDIA_URL }}{{ g.thumbfile }}" style="width: 145px;" border="0" height="120px" /></a>
    </div>
    <div style="float:left;">
      <a href="{% url 'view_game' game_id=g.id %}" class="title">{{ g.name }}</a>
    </div>
  </div>
  {% endfor %}
</div>
