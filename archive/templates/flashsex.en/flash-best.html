 <div style="float:left; width:100%; padding:5px; color:red;"><strong>Best erotic flash games:</strong></div>
 {% for g in best %}
   {% cycle '<div class="gameblock">' '' %}
    <!-- GAME START -->    
         <div class="game">
          <div class="game_thumb"><a href="/game/{{ g.id ]}/"><img src="{{ g.thumbfile }}" alt="{{ g.name }}" /></a></div>
          <div class="game_des">
          <p>{{ g.description|truncatewords:20 }}</p>
          <p class="game_rate">
	    Rate:&nbsp;<span id="mark-{{ g.id }}">{{ g.rate }}</span>
	    <a class="mark" onclick="vote('up', {{ g.id }});">&nbsp;+&nbsp;</a> <a class="mark" onclick="vote('down', {{ g.id }});">&nbsp;-&nbsp;</a>
	    <div>
	      Views:&nbsp;<span style="font-weight: 700;">{{ g.views }}</span>
	    </div>
	    {{ g.comments }}
          </p>
          </div>
        </div>
       <!-- GAME END -->        
   {% cycle '' '</div>' %}         

  {% endfor %}
