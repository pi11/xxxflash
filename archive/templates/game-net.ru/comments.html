<p>Комментарии:</p>
    <div class="comments">
	{% for comment in comments %}
	<div class="comment" align="left">
	  <div class="comment_header">
	    <a name="{{ comment.id }}" href="/game/{{ comment.flash.id }}/#{{ comment.id }}">#{{ comment.id }}</a> 
	    {% if user.is_staff %}
                <a href="/del-comment/{{ comment.id }}">[del]</a>:
	    {% endif %}
		{{ comment.publication_date }} 	  
		<a href="">{{ comment.user }}</a> написал:</div>
	  <div class="comment_text">{{ comment.text }}</div>
	</div>
	{% endfor %}
    </div>
